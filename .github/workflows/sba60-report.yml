name: EduReport SBA 60 and Report PDF

on:
  push:
    branches:
      - feature/sba60-report-watermark-remark-presets-2026-11-21
  pull_request:
    paths:
      - "src/app/dashboard/scores/**"
      - "src/app/dashboard/settings/**"
      - "src/app/dashboard/reports/**"
      - "src/lib/report-pdf.ts"
      - "src/lib/remark-options.ts"
      - "src/components/RemarkPresetSelect.tsx"
      - "src/components/StudentProfile.tsx"
      - "supabase/migrations/*sba60*"
      - "tests/sba60-report-presets.test.ts"
      - ".github/workflows/sba60-report.yml"

permissions:
  contents: read

concurrency:
  group: sba60-report-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report-checks:
    name: Grading, PDF and remark preset verification
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Run all project tests
        run: npm test
      - name: Lint changed grading, report, and staff input files
        run: npx eslint src/app/dashboard/scores/page.tsx src/app/dashboard/settings/page.tsx src/app/dashboard/reports/page.tsx src/lib/report-pdf.ts src/lib/remark-options.ts src/components/RemarkPresetSelect.tsx src/components/StudentProfile.tsx tests/sba60-report-presets.test.ts
      - name: Verify optimized Next.js production build
        run: npm run build
