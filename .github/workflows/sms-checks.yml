name: EduReport Central SMS feature checks

on:
  push:
    branches:
      - feature/edureport-central-sms-2026-10-31
  pull_request:
    paths:
      - "src/app/dashboard/finance/**"
      - "src/app/dashboard/sms/**"
      - "src/app/dashboard/profile/**"
      - "src/app/dashboard/staff/**"
      - "src/components/layout/DashboardShell.tsx"
      - "src/lib/models.ts"
      - "supabase/functions/sms-gateway/**"
      - "supabase/functions/school-admin/**"
      - "supabase/migrations/*sms*"
      - "tests/finance-permissions.sql"
      - ".github/workflows/sms-checks.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend unit tests and SMS lint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run existing unit tests
        run: npm test
      - name: Lint changed SMS and finance UI
        run: npx eslint src/app/dashboard/profile/page.tsx src/app/dashboard/staff/page.tsx src/app/dashboard/sms/page.tsx src/app/dashboard/finance/page.tsx src/components/layout/DashboardShell.tsx src/lib/models.ts

  database:
    name: Disposable SMS RLS and duplicate-send prevention tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install tools
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Start disposable local Supabase services
        run: npx supabase start
      - name: Rebuild only the local database from migrations
        run: npx supabase db reset --local --no-seed
      - name: Run finance and SMS security regressions in a rolled-back transaction
        env:
          PGCONNECT_TIMEOUT: "15"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f tests/finance-permissions.sql
      - name: Stop local services
        if: always()
        run: npx supabase stop --no-backup || true
