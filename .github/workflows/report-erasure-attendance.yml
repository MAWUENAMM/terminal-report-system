name: EduReport Report Layout Attendance and Safe Erasure

on:
  push:
    branches:
      - feature/class-report-one-page-ranks-attendance-deletion-2026-11-23
  pull_request:
    paths:
      - "src/lib/report-pdf.ts"
      - "src/lib/class-sheet-pdf.ts"
      - "src/lib/class-report-pack.ts"
      - "src/app/dashboard/reports/**"
      - "src/app/dashboard/settings/**"
      - "src/app/dashboard/students/**"
      - "src/components/StudentProfile.tsx"
      - "supabase/migrations/*term_attendance_days*"
      - "supabase/migrations/*controlled_learner_erasure*"
      - "tests/report-onepage-ranking-pack.test.ts"
      - ".github/workflows/report-erasure-attendance.yml"

permissions:
  contents: read

concurrency:
  group: class-report-attendance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: One-page PDFs, rank names, attendance, deletion and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Run all project regression tests
        run: npm test
      - name: Lint changed interface and PDF logic
        run: npx eslint src/lib/report-pdf.ts src/lib/class-sheet-pdf.ts src/lib/class-report-pack.ts src/app/dashboard/reports/page.tsx src/app/dashboard/students/page.tsx src/app/dashboard/settings/page.tsx src/components/StudentProfile.tsx tests/report-onepage-ranking-pack.test.ts
      - name: Verify optimized Next.js production build and types
        run: npm run build
