name: Assessment Filters and Mark Input Limits

on:
  push:
    branches:
      - feature/assessment-filters-input-limits-2026-11-21
  pull_request:
    paths:
      - "src/app/dashboard/scores/**"
      - "src/lib/assessment-filters.ts"
      - "tests/assessment-filters-and-mark-limits.test.ts"
      - ".github/workflows/assessment-input.yml"

permissions:
  contents: read

concurrency:
  group: assessment-filters-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assessment-checks:
    name: Assessment input, filtering and full application build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci
      - name: Run all regression tests, including SBA and exam limits
        run: npm test
      - name: Lint changed Assessment code
        run: npx eslint src/app/dashboard/scores/page.tsx src/lib/assessment-filters.ts tests/assessment-filters-and-mark-limits.test.ts
      - name: Full Next.js production build and TypeScript checks
        run: npm run build
