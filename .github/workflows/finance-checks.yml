name: Finance feature checks

on:
  push:
    branches:
      - feature/accountant-finance-foundation
  pull_request:
    paths:
      - 'src/app/dashboard/finance/**'
      - 'src/lib/finance-receipt.ts'
      - 'tests/finance-*'
      - 'supabase/migrations/*accountant*'
      - 'supabase/functions/school-admin/**'
      - '.github/workflows/finance-checks.yml'

permissions:
  contents: read

jobs:
  test:
    name: Finance unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364eab49 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Run existing and finance unit tests
        run: npm test
      - name: Lint source
        run: npm run lint
